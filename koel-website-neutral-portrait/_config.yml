# Site settings
title: "Koel Dutta Chowdhury"
url: "https://koeldc.github.io"   # the full URL of your site
baseurl: ""                       # the subpath of your site, e.g. /repo (leave empty for user site)
description: >
  Koel Dutta Chowdhury is a postdoctoral researcher at UTN working on multilingual
  and trustworthy AI, multilingual representations, reliable evaluation, and grounding.

# Author / contact metadata (optional)
author:
  name: "Koel Dutta Chowdhury"
  affiliation: "Postdoctoral Researcher, University of Technology Nuremberg"
  # email: "you@example.com"    # uncomment and set if you want a contact email published
  bio: >
    Postdoctoral researcher at UTN working on multilingual and trustworthy AI,
    multilingual representations, reliable evaluation, and grounded generation.

# Jekyll / Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Collections
collections:
  news:
    output: true

# Provide default front-matter values for news items so layout is applied automatically
defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: news

# Common sensible defaults (do not change theme here unless you intend to)
permalink: /:categories/:year/:month/:day/:title/
paginate: 10

# Files / directories to exclude from the published site (adjust if needed)
exclude:
  - README.md
  - node_modules
  - Gemfile
  - Gemfile.lock
  - vendor/bundle

# Additional config you may want to keep or add for SEO / feed (optional)
# plugins:
#   - jekyll-feed
#   - jekyll-seo-tag
